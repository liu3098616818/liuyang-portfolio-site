name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许手动重跑（部署失败时在 Actions 页面点 Run workflow 即可）
  workflow_dispatch:

# 必须给 Pages 写入权限，否则 deploy job 会 403
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，后触发的排队而不是互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # path 必须是 ./dist（整个构建产物），不能只传 assets，
      # 否则 index.html 丢了会导致 Pages 找不到入口
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
